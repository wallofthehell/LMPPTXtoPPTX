<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LMPPTXtoPPTX · 슬라이드 텍스트 편집 가능 변환</title>
<style>body{font:15px/1.5 system-ui,'Malgun Gothic',sans-serif;max-width:960px;margin:18px auto;padding:0 14px;color:#222}
button{font:inherit;padding:8px 14px;margin:4px 0;cursor:pointer}.row{display:flex;gap:8px;align-items:center;border-bottom:1px solid #ddd;padding:4px 0}
.row canvas{max-width:300px;max-height:44px;border:1px solid #ccc;flex:none}.row input[type=text]{flex:1;font:inherit;padding:4px;min-width:0}
h4{margin:14px 0 4px;background:#eef;padding:3px 8px}.note{color:#555;font-size:13px}#log{color:#06c;white-space:pre-wrap}</style>
<h2>NotebookLM(Gemini) PPTX → 텍스트 편집 가능 PPTX</h2>
<p class="note">모든 처리는 이 브라우저 안에서만 이루어지며 파일이 서버로 전송되지 않습니다. 첫 실행 시 한국어 OCR 데이터(약 수 MB)를 내려받습니다.<br>
슬라이드 전체가 통그림인 PPTX에서 글자를 인식해 그림에서 지우고 텍스트 상자로 올립니다. <b>OCR은 틀릴 수 있으므로(예: AI→시) 2단계에서 원본 글자 조각(왼쪽 이미지)과 대조해 반드시 수정하세요.</b></p>
<input type="file" id="f" accept=".pptx"> <button id="go">1. 글자 인식</button>
<div id="log"></div><div id="rev"></div>
<div id="opt" hidden>글꼴 <input id="font" value="맑은 고딕"> <button id="build">2. 변환하고 다운로드</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const NS={p:'http://schemas.openxmlformats.org/presentationml/2006/main',a:'http://schemas.openxmlformats.org/drawingml/2006/main',r:'http://schemas.openxmlformats.org/officeDocument/2006/relationships'};
const $=id=>document.getElementById(id),log=m=>$('log').textContent=m,dom=s=>new DOMParser().parseFromString(s,'application/xml');
const med=a=>{a=[...a].sort((x,y)=>x-y);return a.length?a[a.length>>1]:0};
const norm=(base,t)=>new URL(t,'http://x/'+base).pathname.slice(1),relsOf=p=>p.replace(/([^/]+)$/,'_rels/$1.rels');
let zip,items=[],rows=[];
function ov(a,b){const w=Math.min(a[2],b[2])-Math.max(a[0],b[0]),h=Math.min(a[3],b[3])-Math.max(a[1],b[1]);return w>0&&h>0&&w*h>.3*Math.min((a[2]-a[0])*(a[3]-a[1]),(b[2]-b[0])*(b[3]-b[1]))}
function toLines(data,prev){const out=[];for(const L of data.lines||[]){const ws=(L.words||[]).filter(w=>w.confidence>=75&&w.text.trim());if(!ws.length)continue;
 const mh=med(ws.map(w=>w.bbox.y1-w.bbox.y0)),cy=med(ws.map(w=>(w.bbox.y0+w.bbox.y1)/2)),t=ws.map(w=>w.text).join(' ');
 const b=[Math.min(...ws.map(w=>w.bbox.x0)),cy-mh/2,Math.max(...ws.map(w=>w.bbox.x1)),cy+mh/2];
 if(/Notebook/.test(t)||!/[가-힣A-Za-z0-9]{2,}/.test(t)||mh<=10||mh>=160||b[2]-b[0]<=20)continue;
 if(prev&&prev.some(a=>ov(a.b,b)))continue;out.push({t,b})}return out}
function group(lines){lines.sort((p,q)=>p.b[1]-q.b[1]||p.b[0]-q.b[0]);const gs=[];
 for(const l of lines){const h=l.b[3]-l.b[1],cx=(l.b[0]+l.b[2])/2;let ok=false;
  for(const g of gs){const p=g[g.length-1],ph=p.b[3]-p.b[1],dy=l.b[1]-p.b[1];
   if(dy>0&&dy<1.9*ph&&Math.abs(h-ph)<.3*ph&&(Math.abs(l.b[0]-p.b[0])<.6*h||Math.abs(cx-(p.b[0]+p.b[2])/2)<.6*h)){g.push(l);ok=true;break}}
  if(!ok)gs.push([l])}return gs}
function style(id,W,H,b,pad=3){const x0=Math.max(Math.floor(b[0]-pad),0),y0=Math.max(Math.floor(b[1]-pad),0),x1=Math.min(Math.ceil(b[2]+pad),W),y1=Math.min(Math.ceil(b[3]+pad),H);
 if(x1<=x0||y1<=y0)return null;const ring=[],px=(x,y)=>{const i=(y*W+x)*4;return[id[i],id[i+1],id[i+2]]};
 for(let x=x0;x<x1;x++)for(let d=1;d<=6;d++){if(y0-d>=0)ring.push(px(x,y0-d));if(y1-1+d<H)ring.push(px(x,y1-1+d))}
 for(let y=y0;y<y1;y++)for(let d=1;d<=6;d++){if(x0-d>=0)ring.push(px(x0-d,y));if(x1-1+d<W)ring.push(px(x1-1+d,y))}
 const bg=ring.length?[0,1,2].map(c=>med(ring.map(p=>p[c]))):[255,255,255],w=x1-x0,h=y1-y0,dist=new Float32Array(w*h),ds=[];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=px(x0+x,y0+y),d=Math.hypot(p[0]-bg[0],p[1]-bg[1],p[2]-bg[2]);dist[y*w+x]=d;if(d>60)ds.push(dist[y*w+x])}
 if(ds.length<10)return null;ds.sort((a,b)=>a-b);const thr=ds[Math.floor(ds.length*.8)];let n=[0,0,0],c=0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const d=dist[y*w+x];if(d>=thr&&d>60){const p=px(x0+x,y0+y);n[0]+=p[0];n[1]+=p[1];n[2]+=p[2];c++}}
 return{x0,y0,x1,y1,dist,col:n.map(v=>Math.round(v/c)),ink:ds.length/(w*h)}}
function fill(id,mask,W,H){for(let x=0;x<W;x++){let y=0;while(y<H){if(!mask[y*W+x]){y++;continue}const a=y;while(y<H&&mask[y*W+x])y++;
 let lo=a-1,hi=y;if(lo<0)lo=hi;if(hi>=H)hi=lo;for(let j=a;j<y;j++){const t=(j-a+1)/(y-a+1);for(let c=0;c<3;c++)id[(j*W+x)*4+c]=id[(lo*W+x)*4+c]*(1-t)+id[(hi*W+x)*4+c]*t}}}}
async function loadDeck(file){zip=await JSZip.loadAsync(file);const pres=dom(await zip.file('ppt/presentation.xml').async('string')),sz=pres.getElementsByTagNameNS(NS.p,'sldSz')[0],SW=+sz.getAttribute('cx'),SH=+sz.getAttribute('cy');
 const pr=dom(await zip.file('ppt/_rels/presentation.xml.rels').async('string')),map={};for(const r of pr.getElementsByTagName('Relationship'))map[r.getAttribute('Id')]=r.getAttribute('Target');
 const out=[];let n=0;for(const e of pres.getElementsByTagNameNS(NS.p,'sldId')){n++;const t=map[e.getAttributeNS(NS.r,'id')],path=t.startsWith('/')?t.slice(1):'ppt/'+t;
  const xml=dom(await zip.file(path).async('string')),rl=dom(await zip.file(relsOf(path)).async('string')),rm={};
  for(const r of rl.getElementsByTagName('Relationship'))rm[r.getAttribute('Id')]=r;
  for(const pic of xml.getElementsByTagNameNS(NS.p,'pic')){const ext=pic.getElementsByTagNameNS(NS.a,'ext')[0],off=pic.getElementsByTagNameNS(NS.a,'off')[0];
   if(!ext||!off||+ext.getAttribute('cx')<.9*SW||+ext.getAttribute('cy')<.9*SH)continue;const rid=pic.getElementsByTagNameNS(NS.a,'blip')[0].getAttributeNS(NS.r,'embed'),rel=rm[rid];
   out.push({n,path,xml,rl,rel,pic,ox:+off.getAttribute('x'),oy:+off.getAttribute('y'),cx:+ext.getAttribute('cx'),media:norm(path,rel.getAttribute('Target'))})}}
 return out}
async function toCanvas(it){const bytes=await zip.file(it.media).async('uint8array'),bm=await createImageBitmap(new Blob([bytes])),cv=document.createElement('canvas');cv.width=bm.width;cv.height=bm.height;cv.getContext('2d').drawImage(bm,0,0);return cv}
$('go').onclick=async()=>{try{const f=$('f').files[0];if(!f)return log('PPTX 파일을 선택하세요.');$('rev').innerHTML='';$('opt').hidden=true;log('파일 분석 중…');items=await loadDeck(f);rows=[];
 if(!items.length)return log('슬라이드 전체 크기의 그림이 없습니다. 이 파일은 이미 편집 가능하거나 지원 형식이 아닙니다.');
 const worker=await Tesseract.createWorker('kor+eng',1,{logger:m=>m.status&&log(m.status+' '+Math.round((m.progress||0)*100)+'%')});await worker.setParameters({tessedit_pageseg_mode:'11'});
 for(const [k,it] of items.entries()){log(`슬라이드 ${it.n} 인식 중 (${k+1}/${items.length})…`);it.cv=await toCanvas(it);const ctx=it.cv.getContext('2d'),W=it.cv.width,H=it.cv.height;
  const r1=toLines((await worker.recognize(it.cv,{},{blocks:true,text:true})).data);const iv=document.createElement('canvas');iv.width=W;iv.height=H;const ic=iv.getContext('2d'),im=ctx.getImageData(0,0,W,H);
  for(let i=0;i<im.data.length;i+=4){im.data[i]=255-im.data[i];im.data[i+1]=255-im.data[i+1];im.data[i+2]=255-im.data[i+2]}ic.putImageData(im,0,0);
  const r2=toLines((await worker.recognize(iv,{},{blocks:true,text:true})).data,r1);it.groups=group([...r1,...r2])}
 await worker.terminate();const box=$('rev');
 for(const it of items){const h=document.createElement('h4');h.textContent=`슬라이드 ${it.n}`;box.append(h);
  it.groups.forEach((g,gi)=>g.forEach(l=>{const row=document.createElement('div');row.className='row';const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;
   const c=document.createElement('canvas'),b=l.b,w=Math.max(1,Math.round(b[2]-b[0]+16)),hh=Math.max(1,Math.round(b[3]-b[1]+10));c.width=w;c.height=hh;c.getContext('2d').drawImage(it.cv,b[0]-8,b[1]-5,w,hh,0,0,w,hh);
   const t=document.createElement('input');t.type='text';t.value=l.t;row.append(cb,c,t);box.append(row);rows.push({it,gi,l,cb,t})}))}
 log(`인식 완료: ${rows.length}줄. 왼쪽 원본 조각과 대조해 글자를 고치고, 아이콘 오인식·필요 없는 줄은 체크 해제하세요.`);$('opt').hidden=false}catch(e){console.error(e);log('오류: '+e.message)}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('build').onclick=async()=>{try{log('변환 중…');const font=esc($('font').value||'맑은 고딕');let ct=await zip.file('[Content_Types].xml').async('string');
 if(!/Extension="png"/i.test(ct))ct=ct.replace(/(<Types[^>]*>)/,'$1<Default Extension="png" ContentType="image/png"/>');zip.file('[Content_Types].xml',ct);const touched=new Set();let seq=0;
 for(const it of items){const mine=rows.filter(r=>r.it===it&&r.cb.checked&&r.t.value.trim());if(!mine.length)continue;const cv=it.cv,W=cv.width,H=cv.height,ctx=cv.getContext('2d'),im=ctx.getImageData(0,0,W,H),id=im.data,src=new Uint8ClampedArray(id);
  const k=it.cx/W,mask=new Uint8Array(W*H),gs=new Map();
  for(const r of mine){const s=style(src,W,H,r.l.b);if(!s)continue;const w=s.x1-s.x0;for(let y=s.y0;y<s.y1;y++)for(let x=s.x0;x<s.x1;x++)if(s.dist[(y-s.y0)*w+(x-s.x0)]>60)mask[y*W+x]=1;
   if(!gs.has(r.gi))gs.set(r.gi,[]);gs.get(r.gi).push({t:r.t.value,b:r.l.b,col:s.col,ink:s.ink})}
  const d2=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(mask[y*W+x])for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<H&&xx>=0&&xx<W)d2[yy*W+xx]=1}
  fill(id,d2,W,H);ctx.putImageData(im,0,0);const blob=await new Promise(r=>cv.toBlob(r,'image/png')),np=`ppt/media/lm_edit_${++seq}.png`;zip.file(np,await blob.arrayBuffer());it.rel.setAttribute('Target','../media/'+np.split('/').pop());
  const tree=it.xml.getElementsByTagNameNS(NS.p,'spTree')[0];let mid=Math.max(1,...[...it.xml.getElementsByTagNameNS(NS.p,'cNvPr')].map(e=>+e.getAttribute('id')||0));
  it.pic.getElementsByTagNameNS(NS.p,'cNvPr')[0].setAttribute('name','배경(원본 디자인)');let i=0;
  for(const g of gs.values()){i++;const ls=g,x0=Math.min(...ls.map(l=>l.b[0])),x1=Math.max(...ls.map(l=>l.b[2])),y0=ls[0].b[1],y1=ls[ls.length-1].b[3],lh=med(ls.map(l=>l.b[3]-l.b[1]));
   const ctr=ls.length>1&&Math.max(...ls.map(l=>Math.abs((l.b[0]+l.b[2])/2-(x0+x1)/2)))<.6*lh&&Math.max(...ls.map(l=>Math.abs(l.b[0]-x0)))>.8*lh,pt=Math.round(lh*k/12700*.93*10)*10,ink=ls.reduce((a,l)=>a+l.ink,0)/ls.length,col=ls[0].col.map(v=>v.toString(16).padStart(2,'0')).join('');
   const lsp=ls.length>1?`<a:lnSpc><a:spcPts val="${Math.round((y1-y0)/(ls.length-.15)*k/12700*100)}"/></a:lnSpc>`:'';
   const ps=ls.map(l=>`<a:p><a:pPr algn="${ctr?'ctr':'l'}">${lsp}</a:pPr><a:r><a:rPr lang="ko-KR" sz="${pt}" b="${ink>.2?1:0}" dirty="0"><a:solidFill><a:srgbClr val="${col}"/></a:solidFill><a:latin typeface="${font}"/><a:ea typeface="${font}"/></a:rPr><a:t>${esc(l.t)}</a:t></a:r></a:p>`).join('');
   const xml=`<p:sp xmlns:p="${NS.p}" xmlns:a="${NS.a}"><p:nvSpPr><p:cNvPr id="${++mid}" name="텍스트${i}"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${Math.round(it.ox+x0*k)}" y="${Math.round(it.oy+y0*k)}"/><a:ext cx="${Math.round((x1-x0)*k)}" cy="${Math.round((y1-y0)*k)}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr><p:txBody><a:bodyPr wrap="none" lIns="0" tIns="0" rIns="0" bIns="0" anchor="ctr"><a:noAutofit/></a:bodyPr><a:lstStyle/>${ps}</p:txBody></p:sp>`;
   tree.appendChild(it.xml.importNode(dom(xml).documentElement,true))}touched.add(it)}
 const ser=new XMLSerializer(),H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n',done=new Set();
 for(const it of touched){if(done.has(it.path))continue;done.add(it.path);zip.file(it.path,H+ser.serializeToString(it.xml));zip.file(relsOf(it.path),H+ser.serializeToString(it.rl))}
 const rf=Object.keys(zip.files).filter(n=>n.endsWith('.rels')),allr=(await Promise.all(rf.map(n=>zip.file(n).async('string')))).join('');
 for(const it of touched){const b=it.media.split('/').pop();if(zip.file(it.media)&&!allr.includes('/'+b+'"'))zip.remove(it.media)}
 const out=await zip.generateAsync({type:'blob',compression:'DEFLATE'}),a=document.createElement('a');a.href=URL.createObjectURL(out);a.download=($('f').files[0].name.replace(/\.pptx$/i,''))+'_편집가능.pptx';a.click();log('완료: 다운로드된 파일을 PowerPoint에서 여세요. (재변환이 필요하면 페이지를 새로고침 후 다시 시작)')}catch(e){console.error(e);log('오류: '+e.message)}};
</script></html>
